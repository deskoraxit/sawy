<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RESERVAS</title>
    <meta name="theme-color" content="#c7a7ff" />
    <link rel="icon" type="image/png" href="./assets/sawy-logo-icon.png" />
    <link rel="apple-touch-icon" href="./assets/sawy-logo-icon.png" />
    <script>
      (function () {
        try {
          const key = 'sawy_theme';
          const stored = localStorage.getItem(key);
          const theme = stored === 'dark' || stored === 'light'
            ? stored
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#0f172a' : '#c7a7ff');
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>
    <script type="module" src="./js/booking.js"></script>
  </body>
</html>
